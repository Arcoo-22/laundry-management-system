<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers | Bubbly Laundry</title>
  <script>try{var t=localStorage.getItem("laundry-theme");if(!t&&matchMedia("(prefers-color-scheme: dark)").matches)t="dark";if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="14" r="6"/><circle cx="18" cy="7" r="3"/><path d="M6.5 12a3 3 0 0 1 2-1.5"/></svg></div>
      <div class="brand-text">
        <div class="brand-title">Bubbly</div>
        <div class="brand-sub">Laundry</div>
      </div>
    </div>
    <ul class="sidebar-menu">
        <li class="nav-item" data-nav="dashboard">
          <a href="index.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></span><span class="nav-label">Dashboard</span></a>
        </li>
        <li class="nav-item" data-nav="orders">
          <a href="orders.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18l-2 11H5z"/><path d="M8 9l3-5M16 9l-3-5"/><path d="M10 13v4M14 13v4"/></svg></span><span class="nav-label">Orders</span></a>
        </li>
        <li class="nav-item" data-nav="customers">
          <a href="customers.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.6 0 4.5 1.8 4.5 4.5"/></svg></span><span class="nav-label">Customers</span></a>
        </li>
        <li class="nav-item" data-nav="services">
          <a href="services.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path d="M19 3v4M17 5h4"/></svg></span><span class="nav-label">Services</span></a>
        </li>
        <li class="nav-item" data-nav="payments">
          <a href="payments.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="4"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/></svg></span><span class="nav-label">Payments</span></a>
        </li>
    </ul>
    <div class="sidebar-footer">
      <span>v1.0</span>
      <a class="api-link" href="api-docs" target="_blank" rel="noopener">API Docs</a>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="top-bar">
      <h1 class="page-title">Customers</h1>
      <div class="top-actions"><button class="btn btn-primary" id="btn-open-create-customer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Add Customer</button></div>
    </header>
    <main class="content-area">
      <section class="card">
        <div class="card-header">
          <div class="card-heading"><h2 class="card-title">All Customers</h2><span class="card-count" id="customer-count"></span></div>
          <div class="filters-bar">
            <div class="search-box"><span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span><input type="text" id="customer-search-input" placeholder="Search by name"></div>
            <button class="btn btn-outline btn-sm" id="btn-clear-search">Clear</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead><tr><th>ID</th><th>Name</th><th>Contact</th><th>Email</th><th>Address</th><th>Joined</th><th>Actions</th></tr></thead>
            <tbody id="customers-tbody"><tr><td colspan="7" class="loading-cell">Loading…</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="modal-create-customer">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Add Customer</h3>
        <button type="button" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="form-create-customer">
        <div class="modal-body">
          <div class="form-group"><label class="form-label">Full Name *</label><input type="text" class="form-input" id="new-cust-name" placeholder="e.g. Maria Santos" required ></div>
          <div class="form-row"><div class="form-group"><label class="form-label">Contact Number *</label><input type="text" class="form-input" id="new-cust-contact" placeholder="e.g. 09171234567" required ></div><div class="form-group"><label class="form-label">Email *</label><input type="email" class="form-input" id="new-cust-email" placeholder="name@email.com" required ></div></div>
          <div class="form-group"><label class="form-label">Address *</label><input type="text" class="form-input" id="new-cust-address" placeholder="Street, Barangay, City" required ></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Save Customer</button>
        </div>
      </form>
    </div>
  </div>
  <div class="modal-overlay" id="modal-edit-customer">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Edit Customer</h3>
        <button type="button" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <form id="form-edit-customer">
        <div class="modal-body">
          <input type="hidden" id="edit-cust-id">
          <div class="form-group"><label class="form-label">Full Name *</label><input type="text" class="form-input" id="edit-cust-name" placeholder="e.g. Maria Santos" required ></div>
          <div class="form-row"><div class="form-group"><label class="form-label">Contact Number *</label><input type="text" class="form-input" id="edit-cust-contact" placeholder="e.g. 09171234567" required ></div><div class="form-group"><label class="form-label">Email *</label><input type="email" class="form-input" id="edit-cust-email" placeholder="name@email.com" required ></div></div>
          <div class="form-group"><label class="form-label">Address *</label><input type="text" class="form-input" id="edit-cust-address" placeholder="Street, Barangay, City" required ></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="js/customers.js"></script>
</body>
</html>
