<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Bubbly Laundry</title>
  <script>try{var t=localStorage.getItem("laundry-theme");if(!t&&matchMedia("(prefers-color-scheme: dark)").matches)t="dark";if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="14" r="6"/><circle cx="18" cy="7" r="3"/><path d="M6.5 12a3 3 0 0 1 2-1.5"/></svg></div>
      <div class="brand-text">
        <div class="brand-title">Bubbly</div>
        <div class="brand-sub">Laundry</div>
      </div>
    </div>
    <ul class="sidebar-menu">
        <li class="nav-item" data-nav="dashboard">
          <a href="index.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></span><span class="nav-label">Dashboard</span></a>
        </li>
        <li class="nav-item" data-nav="orders">
          <a href="orders.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18l-2 11H5z"/><path d="M8 9l3-5M16 9l-3-5"/><path d="M10 13v4M14 13v4"/></svg></span><span class="nav-label">Orders</span></a>
        </li>
        <li class="nav-item" data-nav="customers">
          <a href="customers.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.6 0 4.5 1.8 4.5 4.5"/></svg></span><span class="nav-label">Customers</span></a>
        </li>
        <li class="nav-item" data-nav="services">
          <a href="services.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path d="M19 3v4M17 5h4"/></svg></span><span class="nav-label">Services</span></a>
        </li>
        <li class="nav-item" data-nav="payments">
          <a href="payments.html"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="4"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/></svg></span><span class="nav-label">Payments</span></a>
        </li>
    </ul>
    <div class="sidebar-footer">
      <span>v1.0</span>
      <a class="api-link" href="api-docs" target="_blank" rel="noopener">API Docs</a>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="top-bar">
      <h1 class="page-title">Dashboard</h1>
      <div class="top-actions"><a class="btn btn-primary" href="orders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> New Order</a></div>
    </header>
    <main class="content-area">
      <section class="stats-grid">
        <div class="stat-card">
          <div class="stat-info"><h3>Total Revenue</h3><div class="stat-value" id="stat-revenue">₱0.00</div></div>
          <div class="stat-icon stat-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="4"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.2"/></svg></div>
        </div>
        <div class="stat-card">
          <div class="stat-info"><h3>Active Orders</h3><div class="stat-value" id="stat-active-orders">0</div></div>
          <div class="stat-icon stat-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9.5 15a2.8 2.8 0 0 0 2.5 2"/></svg></div>
        </div>
        <div class="stat-card">
          <div class="stat-info"><h3>Customers</h3><div class="stat-value" id="stat-customers">0</div></div>
          <div class="stat-icon stat-purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.6 0 4.5 1.8 4.5 4.5"/></svg></div>
        </div>
        <div class="stat-card">
          <div class="stat-info"><h3>Completed Orders</h3><div class="stat-value" id="stat-completed-orders">0</div></div>
          <div class="stat-icon stat-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg></div>
        </div>
      </section>
      <section class="card">
        <div class="card-header">
          <div class="card-heading"><h2 class="card-title">Recent Orders</h2></div>
          <a class="btn btn-outline btn-sm" href="orders.html">View all</a>
        </div>
        <div class="table-responsive">
          <table class="data-table">
            <thead><tr><th>Order</th><th>Customer</th><th>Service</th><th>Weight</th><th>Amount</th><th>Delivery</th><th>Status</th><th>Date</th></tr></thead>
            <tbody id="recent-orders-tbody"><tr><td colspan="8" class="loading-cell">Loading…</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
